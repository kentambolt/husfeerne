name: 🚀 Deploy til GitHub Pages
on:
  push:
    branches: [main]   # kun main udgives – PR-branches deployer ikke
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: 🚚 Hent koden
      uses: actions/checkout@v4

    - name: ⚙️ Konfigurér Pages
      uses: actions/configure-pages@v5

    # Interne noter (*.md) og trykfiler skal ligge i repoet, men ikke på husfeerne.dk.
    - name: 📦 Saml sitet uden interne filer
      run: |
        mkdir _site
        rsync -a ./ _site/ \
          --exclude '.git' \
          --exclude '.github' \
          --exclude '_site' \
          --exclude '*.md' \
          --exclude 'cherpak/_src' \
          --exclude '*.py' \
          --exclude '.gitattributes' \
          --exclude 'husfeerne-logo-print.png' \
          --exclude 'husfeerne-logo.jpg'
        echo "Udgives:"; ls -la _site

    - name: ⬆️ Upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: 🌐 Udgiv
      id: deployment
      uses: actions/deploy-pages@v4
